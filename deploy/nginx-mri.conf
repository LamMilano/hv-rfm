# Nginx site cho Hàng đợi MRI — domain mri.example.vn
# Node (cổng 3003) phục vụ CẢ API lẫn frontend tĩnh (NODE_ENV=production), Nginx chỉ
# đứng trước làm reverse proxy + TLS. Riêng /api/stream (SSE) phải TẮT buffering.
#
# Đặt file: /etc/nginx/sites-available/mri.example.vn
# Bật:      ln -s ../sites-available/mri.example.vn /etc/nginx/sites-enabled/
#           nginx -t && systemctl reload nginx
#
# TLS cho MẠNG NỘI BỘ (LAN): dùng chứng chỉ TỰ KÝ (self-signed), vì Let's Encrypt/certbot
# cần xác thực từ Internet nên KHÔNG dùng được khi domain chỉ truy cập trong mạng viện.
# Tạo chứng chỉ trước khi reload nginx (hiệu lực 10 năm):
#   sudo mkdir -p /etc/nginx/ssl
#   sudo openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
#     -keyout /etc/nginx/ssl/mri.key -out /etc/nginx/ssl/mri.crt \
#     -subj "/C=VN/ST=HCM/L=HCM/O=Ten Benh Vien/CN=mri.example.vn" \
#     -addext "subjectAltName=DNS:mri.example.vn,IP:192.168.1.10"
# Trình duyệt sẽ cảnh báo "không an toàn" một lần (chứng chỉ tự ký) — bấm bỏ qua là vào
# được. Muốn hết cảnh báo: cài /etc/nginx/ssl/mri.crt làm "Trusted Root CA" trên máy
# client (đẩy qua Group Policy nếu dùng AD).

# ── HTTP → chuyển hướng sang HTTPS ───────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name mri.example.vn;
    return 301 https://$host$request_uri;
}

# ── HTTPS ────────────────────────────────────────────────────────────────────────
server {
    # HTTP/2 bật qua tham số trên dòng listen để tương thích nginx cũ (< 1.25.1).
    # nginx mới vẫn chấp nhận cú pháp này.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mri.example.vn;

    ssl_certificate     /etc/nginx/ssl/mri.crt;
    ssl_certificate_key /etc/nginx/ssl/mri.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Cho client tải chỉ định HIS push / payload vừa phải.
    client_max_body_size 5m;

    # ── SSE realtime: KHÔNG đệm, giữ kết nối lâu ───────────────────────────────
    location /api/stream {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # ── Mọi thứ còn lại (API + SPA) → Node ─────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
